services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DOCKER_POSTGRES_DB:-safestep}
      POSTGRES_USER: ${DOCKER_POSTGRES_USER:-safestep}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-safestep_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - safestep-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    image: safestep-api:local
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DOCKER_POSTGRES_DB:-safestep}
      DB_USER: ${DOCKER_POSTGRES_USER:-safestep}
      DB_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-safestep_dev_password}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  safestep-postgres-data:
